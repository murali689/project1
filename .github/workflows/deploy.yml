name: Azure Terraform Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC authentication with Azure
permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: murali-app
  TF_WORKING_DIR: terraform
  APP_WORKING_DIR: app

jobs:

  # ============================================================
  # STAGE 1 - BUILD APPLICATION
  # ============================================================
  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------
      - name: Run tests
        working-directory: app
        run: npm test --if-present

      # ----------------------------------------------------------
      # Create deployment package
      # ----------------------------------------------------------
      - name: Create application package
        working-directory: app
        run: |
          zip -r ../app.zip . \
            -x "node_modules/*" \
            -x ".git/*"

      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip


  # ============================================================
  # STAGE 2 - TERRAFORM INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Stage 2 - Deploy Infrastructure
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      id-token: write
      contents: read

    env:
      # Azure OIDC authentication
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Azure Login using OIDC
      # ----------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Verify Azure authentication
      # ----------------------------------------------------------
      - name: Verify Azure Login
        run: |
          az account show

      # ----------------------------------------------------------
      # Install Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # ----------------------------------------------------------
      # Terraform Format
      # ----------------------------------------------------------
      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan


  # ============================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ============================================================
  deploy:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest

    needs:
      - terraform

    permissions:
      id-token: write
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download application artifact
      # ----------------------------------------------------------
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      # ----------------------------------------------------------
      # Azure Login using OIDC
      # ----------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Deploy to Azure App Service
      # ----------------------------------------------------------
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: app.zip
