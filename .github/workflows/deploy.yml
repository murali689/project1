name: Azure Terraform Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: murali-app
  TF_WORKING_DIR: terraform
  APP_WORKING_DIR: app

jobs:

  # ============================================================
  # STAGE 1 - BUILD APPLICATION
  # ============================================================
  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test --if-present

      - name: Create application package
        working-directory: app
        run: |
          zip -r ../app.zip . \
            -x "node_modules/*" \
            -x ".git/*"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip


  # ============================================================
  # STAGE 2 - TERRAFORM INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Stage 2 - Deploy Infrastructure
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Import existing Azure resources into Terraform state
        working-directory: terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform import -lock=false module.resource_group.azurerm_resource_group.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg" || true
          terraform import -lock=false module.network.azurerm_virtual_network.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/virtualNetworks/murali-vnet" || true
          terraform import -lock=false module.network.azurerm_subnet.public "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/virtualNetworks/murali-vnet/subnets/snet-public" || true
          terraform import -lock=false module.network.azurerm_subnet.app "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/virtualNetworks/murali-vnet/subnets/snet-app" || true
          terraform import -lock=false module.network.azurerm_subnet.pe "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/virtualNetworks/murali-vnet/subnets/snet-private-endpoint" || true
          terraform import -lock=false module.app_insights.azurerm_log_analytics_workspace.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.OperationalInsights/workspaces/murali-law" || true
          terraform import -lock=false module.app_insights.azurerm_application_insights.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Insights/components/murali-appinsights" || true
          terraform import -lock=false module.app_service.azurerm_service_plan.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Web/serverFarms/murali-plan" || true
          terraform import -lock=false module.app_service.azurerm_linux_web_app.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Web/sites/murali-app" || true
          terraform import -lock=false module.sql_database.azurerm_mssql_server.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Sql/servers/murali-sqlsrv" || true
          terraform import -lock=false module.sql_database.azurerm_mssql_database.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Sql/servers/murali-sqlsrv/databases/murali-sqldb" || true
          terraform import -lock=false module.key_vault.azurerm_key_vault.this "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.KeyVault/vaults/murali-keyvault-07" || true
          terraform import -lock=false module.key_vault_private_endpoint.azurerm_private_dns_zone.kv "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/privateDnsZones/privatelink.vaultcore.azure.net" || true
          terraform import -lock=false module.key_vault_private_endpoint.azurerm_private_endpoint.kv "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/privateEndpoints/murali-kv-pe" || true
          terraform import -lock=false module.key_vault_private_endpoint.azurerm_private_dns_zone_virtual_network_link.kv "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/murali-rg/providers/Microsoft.Network/privateDnsZones/privatelink.vaultcore.azure.net/virtualNetworkLinks/murali-kv-dns-link" || true

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -refresh=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan


  # ============================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ============================================================
  deploy:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest

    needs:
      - terraform

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app.zip