```yaml
name: Azure Terraform Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for Azure OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: vaishnavi-app
  TF_WORKING_DIR: terraform
  APP_WORKING_DIR: app

jobs:

  # ============================================================
  # STAGE 1 - BUILD APPLICATION
  # ============================================================
  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 is currently deprecated on GitHub Actions runners.
          # Use Node 22 if your application supports it.
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_WORKING_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.APP_WORKING_DIR }}
        run: npm test --if-present

      - name: Create application package
        working-directory: ${{ env.APP_WORKING_DIR }}
        run: |
          zip -r ../app.zip . \
            -x "node_modules/*" \
            -x ".git/*"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          if-no-files-found: error


  # ============================================================
  # STAGE 2 - DEPLOY INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Stage 2 - Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Azure OIDC Login
      # ----------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

      # ----------------------------------------------------------
      # Terraform Format Check
      # ----------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

        run: terraform apply -auto-approve tfplan


  # ============================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ============================================================
  deploy:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      # ----------------------------------------------------------
      # Download application artifact from Stage 1
      # ----------------------------------------------------------
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .

      # ----------------------------------------------------------
      # Azure OIDC Login
      # ----------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Deploy application to Azure App Service
      # ----------------------------------------------------------
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app.zip
```
